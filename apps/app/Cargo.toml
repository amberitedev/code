[package]
name = "theseus_gui"
# The actual version is set by the theseus-build workflow on tagging
version = "1.0.0-local"
edition.workspace = true
description = "The Modrinth App is a desktop application for managing your Minecraft mods"
repository = "https://github.com/modrinth/code/apps/app/"
license = "GPL-3.0-only"

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
async_zip = { workspace = true, features = ["deflate", "tokio-fs"] }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
either = { workspace = true }
enumset = { workspace = true, features = ["serde"] }
hkdf = { workspace = true }
http-body-util = "0.1.3"
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
keyring = { workspace = true }
native-dialog = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
paste = { workspace = true }
path-util = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-http = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tempfile = { workspace = true }
theseus = { workspace = true, features = ["tauri"] }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
whoami = { workspace = true }

[dependencies.browser-bridge]
path = "../../packages/browser-bridge"
optional = true

[dependencies.tauri]
workspace = true
features = ["devtools", "macos-private-api", "protocol-asset"]

[dev-dependencies]
rcgen = "0.14.7"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = { workspace = true, optional = true }

[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
browser-bridge = ["dep:browser-bridge"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
export-app-events = ["theseus/export-ts"]
updater = []

[lints]
workspace = true
