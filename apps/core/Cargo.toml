[package]
name = "copal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Copal, Amberite's self-hosted Minecraft server manager"
repository.workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["multipart", "ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
# Server folders are written by mods; every path Core opens in one stays inside it.
cap-fs-ext = "3.4"
cap-std = "3.4"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }
crab_nat = "0.8.1"
dunce = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http-body-util = "0.1.3"
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
minecraft-meta-manifest = { workspace = true }
# Checks the signature on Copal release manifests.
minisign-verify = "0.2.4"
netdev = "0.46.3"
rcgen = "0.14.7"
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
# Already in the build through rustls: Ed25519 for tickets and random session tokens.
ring = "0.17.14"
# The ring backend avoids aws-lc-sys's CMake build on Windows.
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# Decrypts the share versions a server applies (`content::shared`).
sharing-types = { workspace = true }
# Listening on IPv6 next to IPv4.
socket2 = "0.6.5"
sqlx = { workspace = true, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# The CLI's console client, at the version axum uses.
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
tokio-util = { workspace = true, features = ["io"] }
toml = { workspace = true }
tower-http = { version = "0.6.6", features = ["timeout", "trace"] }
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ts-rs = { workspace = true, features = ["uuid-impl"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
walkdir = "2.5"
zip = { workspace = true }

[dev-dependencies]
tar = { workspace = true }
tower = { version = "0.5.2", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"

[target."cfg(unix)".dependencies]
# Java runtimes: Azul publishes Linux and macOS packages as tar.gz.
flate2 = { workspace = true }
nix = { version = "0.30.1", features = ["fs", "signal", "user"] }
tar = { workspace = true }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[lints]
workspace = true
