[package]
name = "copal"
version = "0.1.0"
description = "Copal, Amberite's self-hosted Minecraft server manager"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.4"
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }
crab_nat = "0.8.1"
daedalus = { workspace = true }
dunce = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hyper-util = { workspace = true, features = ["http1", "http2", "server-auto", "service", "tokio"] }
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
netdev = "0.46.3"
rcgen = "0.14.7"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
# The ring backend avoids aws-lc-sys's CMake build on Windows.
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { workspace = true }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ts-rs = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
walkdir = "2.5"
zip = { workspace = true }

[lints]
workspace = true
