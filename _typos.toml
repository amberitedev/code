[files]
extend-exclude = [
  "**/src/locales/",
  "apps/frontend/",
  "patches/",
  "packages/utils/",
  "packages/ui/",
  "packages/blog/",
  # generated Cloudflare Workers declarations contain upstream API names and ISO codes
  "apps/realtime/src/worker-configuration.d.ts",
  # contains licenses like `CC-BY-ND-4.0`
  "packages/moderation/src/data/stages/license.ts",
  "packages/moderation/src/utils.ts",
  # contains payment card IDs like `IY1VMST1MOXS` which are flagged
  "apps/labrinth/src/queue/payouts/mod.rs",
  "apps/app-frontend/src/components/ui/settings/instances/game-settings-modal/languages.ts"
]

[default]
extend-ignore-re = [
  # Ignore lines that end with `// typos:ignore`
  "(?Rm)^.*(#|//)\\s*typos:ignore$",
  # Ignore the line after `// typos:ignore`:
  "(#|//)\\s*typos:ignore\\n.*",
  # Ignore blocks between `// typos:off` and `// typos:on`
  "(?s)(#|//)\\s*typos:off.*?\\n\\s*(#|//)\\s*typos:on",
]

[default.extend-words]
# Terms Of Use in `tou-link`
tou = "tou"
# Google Ad Manager
gam = "gam"
# short for "constants"
consts = "consts"
# short for "Copy"
Cpy = "Cpy"
# prefix used to match configuration-related error messages
configur = "configur"

ND = "ND"

[default.extend-identifiers]
# Universal Plug and Play
UPnP = "UPnP"
# BTA dependency project name
HalpLibe = "HalpLibe"
# Constant from the `zip` crate
ZIP64_BYTES_THR = "ZIP64_BYTES_THR"
