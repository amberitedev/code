[workspace]
resolver = "2"
members = [
  "apps/app",
  "apps/core",
  "packages/app-lib",
  "packages/ariadne",
  "packages/browser-bridge",
  "packages/minecraft-meta-manifest",
  "packages/modrinth-content-management",
  "packages/path-util",
  "packages/serde-binhum",
  "packages/sharing-client",
  "packages/sharing-storage",
  "packages/toasty",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/modrinth/code"

