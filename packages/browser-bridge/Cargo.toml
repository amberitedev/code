[package]
name = "amberite-browser-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
description = "Development-only browser bridge for Amberite's Tauri frontend"

[dependencies]
futures = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true, features = ["http1", "server"] }
hyper-tungstenite = "0.18"
hyper-util = { workspace = true, features = ["tokio"] }
mime_guess = "2"
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-os = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "sync"] }
tokio-tungstenite = "0.27"
tracing = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
