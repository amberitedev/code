[package]
name = "contracts"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# The dev-dependency on itself turns every feature on for this crate's own tests.
[package.metadata.cargo-shear]
ignored = ["contracts"]

# The protocol: the Endpoint machinery, the one error body, the protocol version, and the limits and
# share rules. `client` and `server` add the transport glue, `ts` the TypeScript generator. It
# imports none of our crates.
[dependencies]
axum = { version = "0.8.4", default-features = false, features = ["json", "query"], optional = true }
bytes = { workspace = true }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
ts-rs = { workspace = true, features = ["no-serde-warnings"], optional = true }

[dev-dependencies]
contracts = { path = ".", features = ["client", "server", "ts"] }
http-body-util = "0.1.3"
rustls = { workspace = true, features = ["ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
tower = { version = "0.5.2", features = ["util"] }

[features]
client = ["dep:reqwest", "dep:serde_json", "dep:thiserror"]
server = ["dep:axum"]
ts = ["dep:serde_json", "dep:ts-rs"]

[lints]
workspace = true
