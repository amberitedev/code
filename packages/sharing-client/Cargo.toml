[package]
name = "sharing-client"
edition.workspace = true

# What the App and Core share about sharing: the backend client for
# share routes, the share version, the share file rules, the pool (store client, encryption and
# fetch), the writer that pushes a share's versions, reaching Cores, and free disk space. The App
# and Core both push and read shares with them, and the store pulls from other Cores with the store
# client.
[dependencies]
bedrock = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
contracts = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
infer = { workspace = true }
modrinth-content-management = { workspace = true }
path-util = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
# The ring backend avoids aws-lc-sys's CMake build on Windows.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
# The share history table (`history::SCHEMA`), in the App's and Core's SQLite databases.
sqlx = { workspace = true, features = ["json", "runtime-tokio", "sqlite"] }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
# The types the App's UI also sees, generated into `packages/api-client` by Core.
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.30.1", features = ["fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
