[package]
name = "sharing-client"
edition.workspace = true

# What the App and Core share about sharing (`docs/internals/pool.md`): the backend client for
# share routes, the share version, the share file rules, the pool (store client, encryption and
# fetch) and the writer that pushes a share's versions. The App and Core both push and read shares
# with them, and the store pulls from other Cores with the store client.
[dependencies]
bedrock = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
infer = { workspace = true }
modrinth-content-management = { workspace = true }
path-util = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "rustls-no-provider", "stream"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
# The share history table (`history::SCHEMA`), in the App's and Core's SQLite databases.
sqlx = { workspace = true, features = ["json", "runtime-tokio", "sqlite"] }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
# The types the App's UI also sees, generated into `packages/api-client` by Core.
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time"] }

[lints]
workspace = true
