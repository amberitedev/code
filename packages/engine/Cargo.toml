[package]
name = "engine"
# The actual version is set by the theseus-build workflow on tagging
version = "1.0.0-local"
edition.workspace = true

# The self dev-dependency only turns on a feature, so no code names it.
[package.metadata.cargo-shear]
ignored = ["engine"]

[dependencies]
anyhow = { workspace = true }
async-minecraft-ping = { workspace = true, features = ["srv"] }
async-recursion = { workspace = true }
async-trait = { workspace = true }
async-walkdir = { workspace = true }
axum = { version = "0.8.4", default-features = false, features = ["json", "query"] }

bon = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
cap-fs-ext = "3.4"
cap-std = "3.4"
chardetng = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
contracts = { workspace = true, features = ["client", "server"] }
dashmap = { workspace = true, features = ["serde"] }
data-url = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
dirs = { workspace = true }
dunce = { workspace = true }
either = { workspace = true }
encoding_rs = { workspace = true }
enumset = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true, features = ["tokio"] }
futures = { workspace = true, features = ["alloc", "async-await"] }
governor = { workspace = true }
hex = { workspace = true }
hickory-resolver = { workspace = true }
httpdate = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
indexmap = { workspace = true }
infer = { workspace = true }
itertools = { workspace = true }
json5 = { workspace = true }
minecraft-meta-manifest = { workspace = true }
modrinth-content-management = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
parking_lot = { workspace = true }
paste = { workspace = true }
path-util = { workspace = true }
pathdiff = { workspace = true }
phf = { workspace = true }
png = { workspace = true }
quartz_nbt = { workspace = true, features = ["serde"] }
quick-xml = { workspace = true, features = ["async-tokio"] }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = [
  "brotli",
  "charset",
  "deflate",
  "gzip",
  "http2",
  "json",
  "multipart",
  "rustls-no-provider",
  "stream",
  "system-proxy",
] }
rustls = { workspace = true, features = ["logging", "ring", "std", "tls12"] }
same-file = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_ini = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha1 = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
sharing-client = { workspace = true }
shlex = { workspace = true }
sqlx = { workspace = true, features = [
  "json",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
  "uuid",
] }
sysinfo = { workspace = true, features = ["disk", "system"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "sync",
  "time",
] }
tokio-util = { workspace = true, features = ["compat", "io", "io-util", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, features = [
  "bytes-impl",
  "chrono-impl",
  "no-serde-warnings",
  "serde-json-impl",
  "url-impl",
  "uuid-impl",
], optional = true }
url = { workspace = true, features = ["serde"] }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
whoami = { workspace = true }
zbus = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
contracts = { workspace = true, features = ["ts"] }
# Turns `export-ts` on for the engine's own tests, which write its TypeScript.
engine = { path = ".", features = ["export-ts"] }
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

[build-dependencies]
dotenvy = { workspace = true }
dunce = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { workspace = true, features = ["blocks", "nw"] }

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.30.1", features = ["fs", "user"] }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Networking_Connectivity", "Win32_Storage_FileSystem"] }
windows-core = { workspace = true }
winreg = { workspace = true }

[features]
export-ts = [
  "contracts/ts",
  "dep:ts-rs",
  "minecraft-meta-manifest/ts",
  "modrinth-content-management/ts",
]

[lints]
workspace = true
