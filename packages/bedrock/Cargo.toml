[package]
name = "bedrock"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Only the engine files borrowed with `#[path]` use these, and shear does not follow `#[path]`.
[package.metadata.cargo-shear]
ignored = ["chrono", "modrinth-content-management", "serde", "ts-rs", "uuid"]

# The engine's content schema, borrowed in place with `#[path]` so both sides share one definition.
[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
modrinth-content-management = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
ts-rs = { workspace = true, features = [
  "chrono-impl",
  "no-serde-warnings",
  "uuid-impl",
], optional = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[features]
# The engine's `export-ts`: the borrowed types derive their TypeScript there.
export-ts = ["dep:ts-rs"]

[lints]
workspace = true
