packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vue: 3.5.27
minimumReleaseAge: 10080 # 7 days
# Every checkout links its packages from one shared copy in the store instead of copying them, so
# installing in a new worktree takes about a minute instead of eight.
enableGlobalVirtualStore: true
strictPeerDependencies: false
autoInstallPeers: true
publicHoistPattern:
  - 'prettier-plugin-*'
  - '@prettier/plugin-*'
  - 'eslint'
  - '@eslint/*'
  - 'eslint-plugin-*'
  - '@nuxt/eslint-config'
  - 'typescript-eslint'
  - 'vue-eslint-parser'
  - 'globals'
patchedDependencies:
  'readable-stream@2.3.8': 'patches/readable-stream@2.3.8.patch'
peerDependencyRules:
  allowedVersions:
    vite: '8'
    esbuild: '0'
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  canvas: false
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
