name: CI

# The checks agents and people rely on instead of running the full suite locally.
# The Rust job only runs when a Rust input changes; a skipped job counts as passing.

on:
  push:
    branches: [main]
  pull_request:
  # The upstream sync workflow calls this for its branch before a pull request exists.
  workflow_call:
    inputs:
      ref:
        description: Branch to check. Every job runs, without the change filter.
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ inputs.ref != '' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: inputs.ref == ''
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - .cargo/**
              # Whole crate folders: crates compile in or test against files of every type.
              - apps/app/**
              - apps/core/**
              - packages/app-lib/**
              - packages/ariadne/**
              - packages/async-minecraft-ping/**
              - packages/bedrock/**
              - packages/browser-bridge/**
              - packages/contracts/**
              - packages/minecraft-meta-manifest/**
              - packages/modrinth-content-management/**
              - packages/path-util/**
              - packages/serde-binhum/**
              - packages/sharing-client/**
              - packages/sharing-storage/**
              - packages/toasty/**
              # Read from outside a crate: two drift tests' generated files and an icon app-lib embeds.
              - packages/api-client/src/modules/bedrock/limits.ts
              - packages/api-client/src/modules/sharing/rules.ts
              - packages/assets/external/illustrations/minecraft_server_icon.png
              - .github/workflows/ci.yml

  js:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @amberite/backend --filter @amberite/browser-bridge --filter @modrinth/app-frontend typecheck
      - run: pnpm test:unit
      - run: pnpm --filter @amberite/backend --filter @amberite/browser-bridge test
      - run: pnpm dev:check

  hygiene:
    name: Typos and TOML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: tombi@1.4.1
      - run: tombi lint
      - run: tombi fmt --check

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-shear@1.11.2
      - run: cp packages/app-lib/.env.staging packages/app-lib/.env
      # Tauri only checks that the frontend build folder exists; an empty one is enough to compile.
      - run: mkdir -p apps/app-frontend/dist
      - run: cargo fmt --all --check
      - run: cargo shear
      - run: cargo check -p theseus_gui --features browser-bridge --locked
      # serde-binhum's only tests are upstream's README doctests, which lack their dependencies.
      - run: cargo test --workspace --exclude toasty --exclude serde-binhum --locked
      - run: sh -n apps/core/scripts/install.sh
      # A cargo error fails the step, and theseus_gui proves the pattern matches tauri.
      - name: Copal does not depend on Tauri
        run: |
          gui=$(cargo tree --locked -e normal -p theseus_gui --prefix none -f '{p}')
          copal=$(cargo tree --locked -e normal -p copal --prefix none -f '{p}')
          grep -q '^tauri v' <<< "$gui"
          if grep '^tauri v' <<< "$copal"; then echo '::error::copal depends on tauri'; exit 1; fi
