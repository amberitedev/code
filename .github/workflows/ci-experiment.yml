name: CI experiment

# Temporary, deleted before this branch merges. How long ci.yml's lint, typecheck and test job
# takes on Blacksmith.

on:
  push:
    branches: [chore/speed-up-blacksmith-ci]
    paths: [.github/workflows/ci-experiment.yml]

permissions:
  contents: read

concurrency:
  group: ci-experiment
  cancel-in-progress: true

jobs:
  js:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-2vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @amberite/backend --filter @amberite/fixtures --filter @modrinth/api-client --filter @modrinth/app-frontend typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:unit
      - run: pnpm --filter @amberite/backend test
