name: CI experiment

# Temporary, deleted before this branch merges. Second run: what one edit costs to recompile from a
# full target folder, with and without incremental compilation, and with debug info off.

on:
  push:
    branches: [chore/speed-up-blacksmith-ci]
    paths: [.github/workflows/ci-experiment.yml]

permissions:
  contents: read

concurrency:
  group: ci-experiment
  cancel-in-progress: true

# The same as ci.yml: the Rust cache key includes these.
env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

defaults:
  run:
    shell: bash

jobs:
  # The job id is part of the Rust cache key, so this must stay `rust` to restore main's cache.
  rust:
    name: incremental ${{ matrix.incremental }}
    strategy:
      fail-fast: false
      matrix:
        incremental: [0, 1]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write the build script
        run: |
          cat > "$RUNNER_TEMP/build.sh" <<'EOF'
          # build.sh <label> [cargo args]: compiles the tests, then prints what compiled and how long it took.
          label=$1
          shift
          start=$(date +%s)
          if ! cargo test --workspace --exclude toasty --locked --features amberite-app/export-ts --no-run "$@" > "$RUNNER_TEMP/$label.log" 2>&1; then
            tail -60 "$RUNNER_TEMP/$label.log"
            exit 1
          fi
          grep -E '^\s+(Compiling|Finished)' "$RUNNER_TEMP/$label.log" | sed "s/^/EXP: $label /"
          echo "EXP: $label seconds=$(( $(date +%s) - start ))"
          EOF
          cat > "$RUNNER_TEMP/timings.py" <<'EOF'
          import json, re, sys

          html = open(sys.argv[1], encoding="utf8").read()
          units = json.loads(re.search(r"const UNIT_DATA = (\[.*?\]);\s*\n", html, re.S).group(1))
          for unit in sorted(units, key=lambda unit: -unit["duration"])[:8]:
              print(f'EXP: {unit["duration"]:7.1f}s start={unit["start"]:6.1f} {unit["name"]}{unit.get("target", "")} [{unit.get("mode", "")}]')
          EOF

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          components: rustfmt
          cache-save-if: false

      - run: cp -p packages/engine/.env.staging packages/engine/.env
      - run: mkdir -p apps/app-frontend/dist

      - name: Compile, then edit and compile again
        env:
          CARGO_TERM_COLOR: never
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_INCREMENTAL: ${{ matrix.incremental }}
        run: |
          bash "$RUNNER_TEMP/build.sh" full-build --timings
          python3 "$RUNNER_TEMP/timings.py" target/cargo-timings/cargo-timing.html || echo "EXP: could not read the timings"
          du -sh target target/debug/incremental 2>/dev/null | sed 's/^/EXP: size /'
          start=$(date +%s)
          echo "EXP: target compressed MB=$(( $(tar -cf - target | zstd -T0 -3 | wc -c) / 1048576 )) in $(( $(date +%s) - start ))s"

          # A new public function: the engine's interface changes, so its dependents recompile.
          printf '\npub fn ci_experiment_probe() -> u32 {\n    41\n}\n' >> packages/engine/src/lib.rs
          bash "$RUNNER_TEMP/build.sh" engine-interface-edit

          # A changed function body: the interface stays the same.
          sed -i 's/^    41$/    42/' packages/engine/src/lib.rs
          bash "$RUNNER_TEMP/build.sh" engine-body-edit

          # An edit in Copal only.
          printf '\n#[allow(dead_code)]\nfn ci_experiment_probe() -> u32 {\n    7\n}\n' >> apps/core/src/main.rs
          bash "$RUNNER_TEMP/build.sh" copal-edit

          # An edit in the crate everything depends on.
          printf '\npub fn ci_experiment_probe() -> u32 {\n    3\n}\n' >> packages/contracts/src/lib.rs
          bash "$RUNNER_TEMP/build.sh" contracts-edit
