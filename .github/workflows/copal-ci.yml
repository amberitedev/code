name: Copal CI

on:
  push:
    branches: [main]
    paths:
      - apps/core/**
      - packages/copal-cli/**
      - packages/copal-linux-x64/**
      - .github/workflows/copal-ci.yml
  pull_request:
    paths:
      - apps/core/**
      - packages/copal-cli/**
      - packages/copal-linux-x64/**
      - .github/workflows/copal-ci.yml

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          components: rustfmt
          cache: true
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo test
      - run: sh -n scripts/install.sh

  package-linux-x64:
    name: Linux x64 release artifact
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          cp target/release/copal dist/copal
          tar -C dist -czf copal-linux-x64.tar.gz copal
          sha256sum copal-linux-x64.tar.gz > SHA256SUMS
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          node scripts/package-npm.mjs target/release/copal "$VERSION"
          pnpm --dir ../../packages/copal-linux-x64 pack --pack-destination ../../apps/core/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copal-linux-x64
          path: |
            apps/core/copal-linux-x64.tar.gz
            apps/core/SHA256SUMS
            apps/core/dist/amberitedev-copal-linux-x64-*.tgz
