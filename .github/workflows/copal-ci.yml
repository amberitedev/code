name: Copal CI

on:
  push:
    branches: [main]
    paths:
      - apps/core/**
      - packages/copal-cli/**
      - packages/copal-linux-x64/**
      - .github/workflows/copal-ci.yml
  pull_request:
    paths:
      - apps/core/**
      - packages/copal-cli/**
      - packages/copal-linux-x64/**
      - .github/workflows/copal-ci.yml

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          components: rustfmt
          cache: true
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo test
      - run: sh -n scripts/install.sh
