name: Deploy Convex development

on:
  push:
    branches: [main]

concurrency:
  group: convex-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main to Convex development
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy and record the main revision
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          pnpm exec convex deploy --message "GitHub main@${GITHUB_SHA}"
          pnpm exec convex env set AMBERITE_DEV_GIT_SHA "${GITHUB_SHA}"
